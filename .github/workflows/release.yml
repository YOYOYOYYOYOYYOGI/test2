name: Publish ReelForge extension package

# Builds the load-unpacked / Web Store ZIP from reelforge-ai-ugc/ (manifest at
# the archive root), attaches it to the v1.0.0 GitHub Release, and verifies
# the direct download URL from a clean runner.
on:
  push:
    tags:
      - 'v1.0.0'
      - 'v1.*.*-r*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension package
        run: |
          set -euo pipefail
          ZIP="ReelForge-AI-UGC-Video-Generator-v1.0.0.zip"
          rm -rf /tmp/pkg && mkdir -p "/tmp/pkg/$ZIP.dir"
          cp -R reelforge-ai-ugc/. "/tmp/pkg/$ZIP.dir/"
          find "/tmp/pkg/$ZIP.dir" -name '.DS_Store' -delete
          ( cd "/tmp/pkg/$ZIP.dir" && zip -r -q -X "/tmp/pkg/$ZIP" . )
          cp "/tmp/pkg/$ZIP" "$ZIP"
          echo "Package contents:"
          unzip -l "$ZIP"
          test -f /tmp/pkg/$ZIP.dir/manifest.json
          echo "manifest.json is at archive root: OK"

      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import json, zipfile
          z = zipfile.ZipFile("ReelForge-AI-UGC-Video-Generator-v1.0.0.zip")
          m = json.loads(z.read("manifest.json"))
          assert m["manifest_version"] == 3, m
          assert m["version"] == "1.0.0", m
          assert m["permissions"] == ["storage"], m
          for needed in ("popup/popup.html", "settings/settings.html",
                         "background/service-worker.js"):
              assert needed in z.namelist(), needed
          assert not any("node_modules" in n for n in z.namelist())
          assert not any(n.endswith(".sh") for n in z.namelist())
          print("manifest and package layout valid")
          PY

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="ReelForge-AI-UGC-Video-Generator-v1.0.0.zip"
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create v1.0.0 "$ZIP" "$ZIP.sha256" \
              --title "ReelForge AI UGC Video Generator v1.0.0" \
              --notes "Manifest V3 extension package. Download $ZIP, unzip, then load unpacked in chrome://extensions (Developer mode). SHA-256 in $ZIP.sha256."
          fi

      - name: Verify the direct download URL on a clean network
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0/ReelForge-AI-UGC-Video-Generator-v1.0.0.zip"
          echo "Direct URL: $URL"
          rm -f downloaded.zip
          curl -fL --retry 3 -o downloaded.zip "$URL"
          echo "Downloaded bytes: $(stat -c%s downloaded.zip)"
          unzip -t downloaded.zip >/dev/null && echo "downloaded archive integrity: OK"
          # checksum must match what was built
          sha256sum -c <(echo "$(awk '{print $1}' ReelForge-AI-UGC-Video-Generator-v1.0.0.zip.sha256)  downloaded.zip")
          cmp downloaded.zip ReelForge-AI-UGC-Video-Generator-v1.0.0.zip && echo "downloaded bytes identical to published asset: OK"
