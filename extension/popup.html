<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UGC Video Creator</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { width: 280px; margin: 0; padding: 22px; background: #0e1115; color: #f3f5f8; }
    .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #d7f35b; color: #0e1115; font-weight: 900; font-size: 22px; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; font-size: 19px; letter-spacing: -0.03em; }
    p { margin: 0 0 20px; color: #8e98a7; line-height: 1.5; font-size: 13px; }
    button { width: 100%; padding: 12px 14px; border: 0; border-radius: 10px; background: #d7f35b; color: #0e1115; font-weight: 800; cursor: pointer; }
    .hint { margin-top: 15px; font-size: 11px; color: #697381; }
  </style>
</head>
<body>
  <div class="mark">U</div>
  <h1>UGC Video Creator</h1>
  <p>Turn scripts and product shots into on-brand short-form videos.</p>
  <button id="open">Open studio</button>
  <div class="hint">Tip: pin the extension for one-click access.</div>
  <script>
    document.getElementById('open').addEventListener('click', () => {
      if (chrome.sidePanel?.open) chrome.windows.getCurrent(w => chrome.sidePanel.open({ windowId: w.id }));
      else chrome.tabs.create({ url: chrome.runtime.getURL('dashboard.html') });
    });
  </script>
</body>
</html>
